name: Painel e Manutenção Manual

on:
  workflow_dispatch: # Roda apenas quando você clica manualmente

permissions:
  contents: write  # <--- ISSO DA PERMISSÃO PARA O BOT SALVAR OS ARQUIVOS NO REPOSITÓRIO

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Executar script sob demanda
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gerar_site.py

      - name: Enviar alterações
        run: |
          git config --global user.name "Agente Camaçari Cabos"
          git config --global user.email "acoes@github.com"
          git add index.html produtos.html blog.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat: Atualização manual via IA" && git push)
