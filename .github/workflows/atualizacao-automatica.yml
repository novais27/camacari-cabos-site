name: Atualizar Site com IA

on:
  schedule:
    - cron: '0 8 * * 1' # Roda toda segunda-feira às 08:00 (ou ajuste conforme sua preferência)
  workflow_dispatch: # Permite disparar manualmente pelo site do GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do Gemini
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Executar script de geração de conteúdo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gerar_site.py

      - name: Enviar alterações de volta para o repositório
        run: |
          git config --global user.name "Agente Camaçari Cabos"
          git config --global user.email "acoes@github.com"
          git add index.html produtos.html blog.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat: Atualização automática de conteúdo via IA" && git push)
