name: Agente Semanal do Blog Camaçari Cabos

on:
  schedule:
    # Roda toda segunda-feira às 11:00 UTC (08:00 da manhã no horário da Bahia)
    - cron: '0 11 * * 1'
  workflow_dispatch: # Mantém o botão manual caso queira rodar fora de hora

permissions:
  contents: write

jobs:
  atualizar-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar biblioteca oficial do Gemini
        run: pip install google-genai

      - name: Gerar 3 novos artigos no blog.html
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gerar_site.py

      - name: Publicar atualização do Blog no GitHub
        run: |
          git config --global user.name "Agente Blog Camaçari Cabos"
          git config --global user.email "contato@camacaricabos.com.br"
          git add blog.html
          git diff --staged --quiet || git commit -m "chore(blog): Adiciona 3 novos artigos semanais automaticamente"
          git push
